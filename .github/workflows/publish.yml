name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      keyToDispatch:
        description: Publishing authorization key
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - name: Validate publishing key
        env:
          PROVIDED_KEY: ${{ inputs.keyToDispatch }}
          EXPECTED_KEY: ${{ secrets.KEY_TO_DISPATCH }}
        shell: bash
        run: |
          if [[ -z "$EXPECTED_KEY" ]]; then
            echo "KEY_TO_DISPATCH repository secret is not configured."
            exit 1
          fi

          if [[ "$PROVIDED_KEY" != "$EXPECTED_KEY" ]]; then
            echo "Publishing authorization failed."
            exit 1
          fi

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
